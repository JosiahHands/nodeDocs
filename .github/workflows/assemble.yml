name: Assemble index.html
on:
  push:
    branches: [main]
    paths: ['build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          if [ ! -f build/part1 ] || [ ! -f build/part2 ]; then
            echo "Both parts are not present yet; nothing to do."
            exit 0
          fi
          cat build/part1 build/part2 > index.html
          echo "4f99b1070eae31646605d86b7d121bf33e9dcd13627099f7dc2a55c760fee764  index.html" | sha256sum -c -
          ls -l index.html
      - name: Commit index.html and remove build/
        if: hashFiles('build/part1') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet build
          git add index.html
          git commit -m "Assemble index.html from build parts (sha256 verified) and remove build/"
          git push
